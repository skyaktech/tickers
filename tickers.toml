[server]
port = 8080
static_dir = "./frontend/dist"

[defaults]
check_interval = 60  # seconds
timeout = 10         # seconds

[database]
url = "sqlite://data/tickers.db"

# Telegram downtime/recovery notifications (one bot per instance).
# Omit this whole section to disable. Both bot_token and chat_ids are required.
# [telegram]
# bot_token = "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"  # from @BotFather
# chat_ids = ["123456789", "-1001234567890"]               # users, groups, or @channel
# failure_threshold = 3   # consecutive failed checks before a DOWN alert (default 3)

[[services]]
id = "example"
name = "Example Service"
url = "https://httpbin.org/status/200"
expected_status = 200
# expected_body = "ok"           # substring match
# expected_body = "/healthy/i"   # case-insensitive regex match
